apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "placement-portal.fullname" . }}-config
  labels:
    {{- include "placement-portal.commonLabels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  MONGO_DATABASE: {{ .Values.config.mongoDatabase | quote }}
  MONGO_PORT: {{ .Values.config.mongoPort | quote }}
  CLIENT_URL: {{ .Values.config.clientUrl | quote }}
