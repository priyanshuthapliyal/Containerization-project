apiVersion: v1
kind: Service
metadata:
  name: {{ include "placement-portal.fullname" . }}-db-headless
  labels:
    {{- include "placement-portal.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app.kubernetes.io/name: {{ include "placement-portal.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "placement-portal.fullname" . }}-db
  labels:
    {{- include "placement-portal.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app.kubernetes.io/name: {{ include "placement-portal.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "placement-portal.fullname" . }}-db
  labels:
    {{- include "placement-portal.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "placement-portal.fullname" . }}-db-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "placement-portal.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "placement-portal.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "placement-portal.fullname" . }}-secrets
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "placement-portal.fullname" . }}-secrets
                  key: mongo-root-password
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: 
          - {{ .Values.mongodb.persistence.accessMode | quote }}
        {{- if .Values.mongodb.persistence.storageClass }}
        storageClassName: {{ .Values.mongodb.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size | quote }}
