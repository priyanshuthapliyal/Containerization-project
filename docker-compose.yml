version: "3.8"

services:
  # ==========================================================
  # Database Service (MongoDB)
  # ==========================================================
  placement-db:
    image: mongo:6.0-jammy
    container_name: placement-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-db_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_this_to_a_secure_password}
    volumes:
      - mongodb_data:/data/db
    networks:
      - placement-net
    # No ports exposed to the host machine for security.
    # Access is restricted entirely to the internal container network.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================
  # Backend API Service
  # ==========================================================
  placement-backend:
    # Use the pre-built image you pushed to Docker Hub
    image: priyanshuthapliyal/placement-backend:v2
    # To build from local files instead, comment out 'image' and uncomment below:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    container_name: placement-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Explicit overrides if .env keys are missing
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-db_admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_this_to_a_secure_password}@placement-db:27017/${MONGO_DATABASE:-placement_portal}?authSource=admin
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - placement-net
    # Port 5000 is not exposed to the host because the frontend Nginx proxies to it.
    depends_on:
      placement-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================
  # Frontend Web Service
  # ==========================================================
  placement-frontend:
    # Use the pre-built image you pushed to Docker Hub
    image: priyanshuthapliyal/placement-frontend:v2
    # To build from local files instead, comment out 'image' and uncomment below:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    #   args:
    #     - VITE_API_URL=/api/v1
    #     - VITE_BACKEND_URL=
    container_name: placement-frontend
    restart: unless-stopped
    ports:
      # Binds the host machine port (default: 80) to Nginx port 80 inside the container.
      - "${FRONTEND_HOST_PORT:-80}:80"
    networks:
      - placement-net
    depends_on:
      placement-backend:
        condition: service_healthy

# ==========================================================
# Network and Volume Declarations
# ==========================================================
networks:
  placement-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local
