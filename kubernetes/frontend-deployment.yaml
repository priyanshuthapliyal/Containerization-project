apiVersion: v1
kind: Service
metadata:
  name: placement-frontend
  namespace: placement
  labels:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: college-placement-app
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: frontend

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-frontend
  namespace: placement
  labels:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: college-placement-app
spec:
  # Static frontend is stateless, can easily scale to 2+ replicas
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: college-placement-app
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: college-placement-app
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: priyanshuthapliyal/placement-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
