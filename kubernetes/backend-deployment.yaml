apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: placement-backend-uploads-pvc
  namespace: placement
  labels:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: college-placement-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---

apiVersion: v1
kind: Service
metadata:
  name: placement-backend
  namespace: placement
  labels:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: college-placement-app
spec:
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  selector:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: backend

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-backend
  namespace: placement
  labels:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: college-placement-app
spec:
  # Keep 1 replica by default due to ReadWriteOnce PVC access mode.
  # If scaling is desired, configure a ReadWriteMany (RWX) storage volume
  # or change backend code to use Object Storage (S3/GCS).
  replicas: 1
  strategy:
    type: Recreate # Needed for RWO volume mounting swap
  selector:
    matchLabels:
      app.kubernetes.io/name: college-placement-app
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: college-placement-app
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: backend
          image: priyanshuthapliyal/placement-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: placement-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: placement-config
                  key: PORT
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: placement-config
                  key: MONGO_DATABASE
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: placement-config
                  key: CLIENT_URL
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: mongo-root-password
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: jwt-access-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: placement-secrets
                  key: jwt-refresh-secret
            # Dynamic connection string construction in k8s
            - name: MONGODB_URI
              value: mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@placement-db:27017/$(MONGO_DATABASE)?authSource=admin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: backend-uploads
              mountPath: /app/uploads
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: placement-backend-uploads-pvc
