apiVersion: v1
kind: ConfigMap
metadata:
  name: placement-config
  namespace: placement
  labels:
    app.kubernetes.io/name: college-placement-app
    app.kubernetes.io/part-of: college-placement-app
data:
  NODE_ENV: "production"
  PORT: "5000"
  MONGO_DATABASE: "placement_portal"
  MONGO_PORT: "27017"
  # Replace with the domain/IP pointing to the Ingress controller for CORS support
  CLIENT_URL: "http://localhost"
